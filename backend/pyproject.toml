[project]
name = "research-portal-backend"
version = "0.1.0"
description = "Backend service for the Python-focused agentic research portal."
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "langchain>=0.2.0,<0.3.0",
    "langgraph>=0.0.50,<0.1.0",
    "langsmith>=0.1.33,<0.2.0",
    "openai>=1.34.0,<2.0.0",
    "tavily-python>=0.3.3,<0.4.0",
    "redis>=5.0.4,<6.0.0",
    "structlog>=24.1.0,<25.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "psycopg[binary]>=3.1.19,<4.0.0",
    "pgvector>=0.2.4,<0.3.0",
    "alembic>=1.13.1,<2.0.0",
    "tenacity>=8.3.0,<9.0.0",
    "langchain-openai>=0.1.10,<0.2.0",
    "pypdf>=5.1.0,<6.0.0",
    "markdown>=3.6,<4.0",
    "python-multipart>=0.0.9,<0.1.0",
    "cryptography>=43.0.1,<44.0.0",
    "langchain-community>=0.2.12,<0.3.0",
    "langchain-google-genai>=1.0.10,<2.0.0",
    "google-generativeai>=0.7.2,<0.8.0",
    "fpdf2>=2.8.1,<3.0.0",
    "opentelemetry-sdk>=1.26.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.26.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0,<0.48",
    "opentelemetry-instrumentation-requests>=0.47b0,<0.48",
    "prometheus-client>=0.20.0,<0.21.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "httpx>=0.27.0,<0.28.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "supabase>=2.0.0,<3.0.0",
    "setuptools<81",
